<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Practice App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>QA Practice App</h1>

    <section id="login-section">
      <h2>Login</h2>
      <form id="login-form" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="off" data-testid="username-input">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="off" data-testid="password-input">

        <button type="submit" data-testid="login-button">Log in</button>
        <p id="login-message" role="alert" data-testid="login-message"></p>
      </form>
    </section>

    <section id="welcome-section" hidden>
      <h2 id="welcome-heading" data-testid="welcome-heading"></h2>
      <button id="logout-button" type="button" data-testid="logout-button">Log out</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
